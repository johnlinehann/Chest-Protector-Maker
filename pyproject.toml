[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chestforge"
version = "0.1.0"
description = "Simulate and optimize catcher chest-protector padding against NOCSAE ND200-22m25. Simulated — not NOCSAE certified."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pyyaml>=6", "pydantic>=2", "numba>=0.61", "optuna>=4", "scikit-learn>=1.4", "matplotlib>=3.8"]

[project.scripts]
chestforge = "chestforge.app:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
cad = ["build123d>=0.13"]   # geometry + STEP/STL export (Milestone 5)

[tool.setuptools.packages.find]
include = ["chestforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
